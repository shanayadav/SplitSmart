<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Expense | SplitSmart</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="mobile-header">
    <a class="brand" href="/">SplitSmart.</a>
    <button class="menu-button" data-menu-button aria-label="Open menu">☰</button>
  </header>
  <div class="app-shell">
    <aside class="sidebar" data-sidebar>
      <a class="brand" href="/">SplitSmart.</a>
      <nav class="nav-links" aria-label="Main navigation">
        <a class="nav-link" href="/"><span class="nav-icon">⌂</span>Dashboard</a>
        <a class="nav-link" href="/pages/groups.html"><span class="nav-icon">♧</span>My Groups</a>
        <a class="nav-link active" href="/pages/add-expense.html"><span class="nav-icon">＋</span>Add Expense</a>
        <a class="nav-link" href="/pages/balances.html"><span class="nav-icon">◈</span>Balances</a>
        <a class="nav-link" href="/pages/history.html"><span class="nav-icon">◷</span>History</a>
      </nav>
    </aside>
    <div class="menu-overlay" data-menu-overlay></div>

    <main class="page-content">
      <section class="page-heading">
        <div>
          <h1>Add a New Expense</h1>
          <p class="subtitle">Record an expense and divide it equally.</p>
        </div>
      </section>

      <form class="card form-card" id="expense-form">
        <div class="form-grid">
          <div class="form-field full-width">
            <label for="description">Expense name</label>
            <input id="description" name="description" type="text" placeholder="Example: Dinner" maxlength="60" required>
          </div>
          <div class="form-field">
            <label for="amount">Amount (₹)</label>
            <input id="amount" name="amount" type="number" min="1" step="0.01" placeholder="0" required>
          </div>
          <div class="form-field">
            <label for="date">Date</label>
            <input id="date" name="date" type="date" required>
          </div>
          <div class="form-field">
            <label for="group">Group</label>
            <select id="group" name="group" required>
              <option value="">Choose a group</option>
            </select>
          </div>
          <div class="form-field">
            <label for="paid-by">Paid by</label>
            <select id="paid-by" name="paidBy" required>
              <option value="">Choose a group first</option>
            </select>
          </div>
          <fieldset class="form-field full-width split-fieldset">
            <legend>Split between</legend>
            <div class="split-choice-row">
              <label class="choice-option">
                <input type="radio" name="splitType" value="all" checked>
                All group members
              </label>
              <label class="choice-option">
                <input type="radio" name="splitType" value="selected">
                Choose people
              </label>
            </div>
            <div class="member-checklist" id="member-checklist" hidden></div>
          </fieldset>
        </div>

        <div class="split-preview" id="split-preview"></div>
        <button class="button" id="save-expense-button" type="submit" disabled>Save Expense</button>
        <div class="message" id="form-message" role="status"></div>
      </form>
    </main>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/add-expense.js"></script>
</body>
</html>
